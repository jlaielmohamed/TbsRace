<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a09">
  <meta name="description" content="A quiet, distraction-free TbsRace focus session.">
  <title>Focus mode · TbsRace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/timer.css">
  <link rel="stylesheet" href="../css/pages/active-timer.css">
  <script src="../js/env-check.js" defer></script>
  <script type="module" src="../js/active-timer.js"></script>
</head>
<body data-page="active-timer">
  <div class="focus-brand" aria-label="TbsRace focus mode">
    <span class="brand-tbs">Tbs</span><span class="brand-race">Race</span>
    <span class="focus-brand-label">FOCUS MODE</span>
  </div>
  <main id="main" class="page page-active-timer">
    <div class="container">
      <div class="timer-layout">
        <section class="card timer-card" aria-labelledby="timer-heading">
          <h1 id="timer-heading" class="visually-hidden">Focus session</h1>
          <div id="timer-ring-wrap" class="timer-ring-wrap">
            <svg class="timer-ring" viewBox="0 0 320 320" aria-hidden="true" focusable="false">
              <circle class="timer-ring-track" cx="160" cy="160" r="146"></circle>
              <circle id="timer-ring-progress" class="timer-ring-progress" cx="160" cy="160" r="146"></circle>
            </svg>
            <div class="timer-ring-inner">
              <div class="timer-status">
                <span id="timer-dot" class="timer-dot" data-state="running" aria-hidden="true"></span>
                <span id="timer-status-text" class="timer-status-text">Loading session…</span>
              </div>
              <div id="timer-display" class="timer-display" role="timer" aria-live="off">00:00:00</div>
              <p id="timer-subline" class="timer-subline">Restoring your session…</p>
            </div>
          </div>
          <div class="timer-form">
            <div id="timer-alert" class="timer-alert" role="status" hidden>
              <span class="timer-alert-icon" aria-hidden="true">◆</span>
              <span data-alert-text>Time’s up — finish and save.</span>
            </div>
            <div class="timer-actions">
              <button id="timer-toggle" class="btn btn-gold btn-timer" type="button">Pause</button>
              <button id="timer-finish" class="btn btn-outline btn-timer" type="button">Finish &amp; save</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
