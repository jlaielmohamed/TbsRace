<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a09">
  <title>Focusing · TbsRace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/timer.css">
  <style>
    /* FORCED CENTERING AND HIGH VISIBILITY DESIGN */
    body[data-page="active-timer"] {
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevent scrolling to keep it perfectly centered */
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(216, 180, 74, 0.08) 0%, #0a0a09 70%);
    }
    .page-active-timer {
      display: grid !important;
      place-items: center !important;
      width: 100% !important;
      height: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    .page-active-timer .container {
      display: grid !important;
      place-items: center !important;
      max-width: none !important;
      width: 100% !important;
    }
    .page-active-timer .timer-layout {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      width: 100% !important;
    }
    .page-active-timer .timer-card {
      margin: 0 auto !important;
      text-align: center !important;
      max-width: 520px !important;
      width: 90% !important;
      padding: clamp(40px, 6vw, 60px) !important;
      border: 3px solid var(--line-gold) !important;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.8), 0 0 30px rgba(216, 180, 74, 0.15) !important;
      z-index: 10;
    }
    .page-active-timer .timer-ring-wrap {
      width: min(100%, 480px) !important;
      margin: 0 auto 50px !important;
      transform: scale(1.2) !important;
    }
    .page-active-timer .timer-display {
      font-size: clamp(3.5rem, 18vw, 6rem) !important;
      letter-spacing: -0.06em !important;
      font-weight: 700 !important;
    }
    .page-active-timer .timer-form {
      display: grid !important;
      gap: 40px !important;
      justify-items: center !important;
    }
    .page-active-timer .field {
      width: 100% !important;
      max-width: 350px !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      gap: 12px !important;
    }
    .page-active-timer .field-label {
      font-size: 1.2rem !important;
      font-weight: 700 !important;
      color: var(--gold) !important;
      text-transform: uppercase !important;
      letter-spacing: 0.15em !important;
    }
    .page-active-timer #subject-display {
      font-size: 1.6rem !important;
      font-weight: 800 !important;
      padding: 15px !important;
      background: rgba(255, 255, 255, 0.08) !important;
      border: 2px solid var(--line-gold) !important;
      border-radius: 16px !important;
      text-align: center !important;
      color: var(--text) !important;
      width: 100% !important;
    }
    .page-active-timer .timer-actions {
      width: 100% !important;
      max-width: 480px !important;
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 20px !important;
      justify-content: center !important;
    }
    .page-active-timer .btn-timer {
      min-height: 70px !important;
      font-size: 1.2rem !important;
      font-weight: 700 !important;
      border-radius: 20px !important;
      transition: transform 0.2s ease !important;
    }
    .page-active-timer .btn-timer:active {
      transform: scale(0.95);
    }
    .page-active-timer .site-footer {
      position: fixed !important;
      bottom: 30px !important;
      left: 0;
      right: 0;
      width: 100% !important;
      border: 0 !important;
      background: transparent !important;
      z-index: 5;
    }
  </style>
  <script type="module" src="../js/active-timer.js"></script>
</head>
<body data-page="active-timer">
  <main id="main" class="page page-active-timer">
    <div class="container">
      <div class="timer-layout">
        <section class="card timer-card" aria-labelledby="timer-heading">
          <h2 id="timer-heading" class="visually-hidden">Focus session</h2>

          <div id="timer-ring-wrap" class="timer-ring-wrap">
            <svg class="timer-ring" viewBox="0 0 320 320" aria-hidden="true" focusable="false">
              <circle class="timer-ring-track" cx="160" cy="160" r="146"></circle>
              <circle id="timer-ring-progress" class="timer-ring-progress" cx="160" cy="160" r="146"></circle>
            </svg>
            <div class="timer-ring-inner">
              <div class="timer-status">
                <span id="timer-dot" class="timer-dot" data-state="running" aria-hidden="true"></span>
                <span id="timer-status-text" class="timer-status-text">Focusing...</span>
              </div>
              <div id="timer-display" class="timer-display" role="timer" aria-live="off">00:00:00</div>
              <p id="timer-subline" class="timer-subline">Loading session...</p>
            </div>
          </div>

          <div class="timer-form">
            <div class="field">
              <label class="field-label">Subject</label>
              <input id="subject-display" type="text" readonly class="is-locked">
            </div>

            <div id="timer-alert" class="timer-alert" role="status" hidden>
              <span class="timer-alert-icon" aria-hidden="true">◆</span>
              <span data-alert-text>Time’s up — finish and save.</span>
            </div>

            <div class="timer-actions">
              <button id="timer-toggle" class="btn btn-gold btn-timer" type="button">Pause</button>
              <button id="timer-finish" class="btn btn-outline btn-timer" type="button">Finish &amp; save</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="site-footer-copy">&copy; 2026 Mohamed Jlaiel, TBS Freshman student</p>
    </div>
  </footer>
</body>
</html>
