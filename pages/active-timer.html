<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a09">
  <title>Focusing · TbsRace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/timer.css">
  <script type="module" src="../js/active-timer.js"></script>
</head>
<body data-page="active-timer">
  <main id="main" class="page page-timer">
    <div class="container">
      <div class="timer-layout">
        <section class="card timer-card" aria-labelledby="timer-heading">
          <h2 id="timer-heading" class="visually-hidden">Focus session</h2>

          <div id="timer-ring-wrap" class="timer-ring-wrap">
            <svg class="timer-ring" viewBox="0 0 320 320" aria-hidden="true" focusable="false">
              <circle class="timer-ring-track" cx="160" cy="160" r="146"></circle>
              <circle id="timer-ring-progress" class="timer-ring-progress" cx="160" cy="160" r="146"></circle>
            </svg>
            <div class="timer-ring-inner">
              <div class="timer-status">
                <span id="timer-dot" class="timer-dot" data-state="running" aria-hidden="true"></span>
                <span id="timer-status-text" class="timer-status-text">Focusing...</span>
              </div>
              <div id="timer-display" class="timer-display" role="timer" aria-live="off">00:00:00</div>
              <p id="timer-subline" class="timer-subline">Loading session...</p>
            </div>
          </div>

          <div class="timer-form">
            <div class="field">
              <label class="field-label">Subject</label>
              <input id="subject-display" type="text" readonly class="is-locked">
            </div>

            <div id="timer-alert" class="timer-alert" role="status" hidden>
              <span class="timer-alert-icon" aria-hidden="true">◆</span>
              <span data-alert-text>Time’s up — finish and save.</span>
            </div>

            <div class="timer-actions">
              <button id="timer-toggle" class="btn btn-gold btn-timer" type="button">Pause</button>
              <button id="timer-finish" class="btn btn-outline btn-timer" type="button">Finish &amp; save</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="site-footer-copy">&copy; 2026 Mohamed Jlaiel, TBS Freshman student</p>
    </div>
  </footer>
</body>
</html>
