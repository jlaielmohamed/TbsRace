<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a09">
  <title>Focusing · TbsRace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/timer.css">
  <style>
    /* Focused, Centered, and High-Impact Design for Active Timer */
    .page-active-timer {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding-block: 20px;
      background: radial-gradient(circle at center, rgba(216, 180, 74, 0.05) 0%, transparent 70%);
    }
    .page-active-timer .container {
      display: grid;
      place-items: center;
      width: 100%;
    }
    .page-active-timer .timer-layout {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .page-active-timer .timer-card {
      margin-inline: auto;
      text-align: center;
      max-width: 480px;
      width: 100%;
      padding: clamp(30px, 5vw, 50px);
      border: 2px solid var(--line-gold);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), 0 0 20px rgba(216, 180, 74, 0.1);
    }
    .page-active-timer .timer-ring-wrap {
      width: min(100%, 440px);
      margin-bottom: 40px;
      transform: scale(1.1);
    }
    .page-active-timer .timer-display {
      font-size: clamp(3rem, 15vw, 5rem) !important;
      letter-spacing: -0.05em !important;
    }
    .page-active-timer .timer-form {
      display: grid;
      gap: 32px;
      justify-items: center;
    }
    .page-active-timer .field {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .page-active-timer .field-label {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .page-active-timer #subject-display {
      font-size: 1.4rem;
      font-weight: 700;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line-gold);
      border-radius: 12px;
      text-align: center;
      color: var(--text);
      width: 100%;
    }
    .page-active-timer .timer-actions {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      justify-content: center;
    }
    .page-active-timer .btn-timer {
      min-height: 64px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 16px;
    }
    .page-active-timer .site-footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      border: 0;
      background: transparent;
    }
  </style>
  <script type="module" src="../js/active-timer.js"></script>
</head>
<body data-page="active-timer">
  <main id="main" class="page page-active-timer">
    <div class="container">
      <div class="timer-layout">
        <section class="card timer-card" aria-labelledby="timer-heading">
          <h2 id="timer-heading" class="visually-hidden">Focus session</h2>

          <div id="timer-ring-wrap" class="timer-ring-wrap">
            <svg class="timer-ring" viewBox="0 0 320 320" aria-hidden="true" focusable="false">
              <circle class="timer-ring-track" cx="160" cy="160" r="146"></circle>
              <circle id="timer-ring-progress" class="timer-ring-progress" cx="160" cy="160" r="146"></circle>
            </svg>
            <div class="timer-ring-inner">
              <div class="timer-status">
                <span id="timer-dot" class="timer-dot" data-state="running" aria-hidden="true"></span>
                <span id="timer-status-text" class="timer-status-text">Focusing...</span>
              </div>
              <div id="timer-display" class="timer-display" role="timer" aria-live="off">00:00:00</div>
              <p id="timer-subline" class="timer-subline">Loading session...</p>
            </div>
          </div>

          <div class="timer-form">
            <div class="field">
              <label class="field-label">Subject</label>
              <input id="subject-display" type="text" readonly class="is-locked">
            </div>

            <div id="timer-alert" class="timer-alert" role="status" hidden>
              <span class="timer-alert-icon" aria-hidden="true">◆</span>
              <span data-alert-text>Time’s up — finish and save.</span>
            </div>

            <div class="timer-actions">
              <button id="timer-toggle" class="btn btn-gold btn-timer" type="button">Pause</button>
              <button id="timer-finish" class="btn btn-outline btn-timer" type="button">Finish &amp; save</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="site-footer-copy">&copy; 2026 Mohamed Jlaiel, TBS Freshman student</p>
    </div>
  </footer>
</body>
</html>
